# Launcher icons — https://pub.dev/packages/flutter_launcher_icons
# Regenerate after edits: flutter pub get && dart run flutter_launcher_icons
# (Optional scaffold: dart run flutter_launcher_icons:generate)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#1F1F4B"
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#0F172A"
    theme_color: "#6366F1"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.png

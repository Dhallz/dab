services:
  db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dab_api_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    container_name: relic
    build:
      context: .
      target: build
    ports:
      - "8081:8081"
      - "8181:8181"
    volumes:
      - .:/app
      - /app/.dart_tool
    command: sh -c "dart pub get && dart run --enable-vm-service=8181/0.0.0.0 bin/dab_api.dart"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASS=password
      - DB_NAME=dab_api_db
    depends_on:
      - db

volumes:
  pgdata:

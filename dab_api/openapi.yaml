openapi: 3.0.3
info:
  title: Dev Activity Board (DAB) API
  description: High-performance aggregator of developer activities, featuring real-time caching and the Vegas Sync Pattern.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        phorgePhid:
          type: string
          nullable: true
        phorgeUsername:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK with JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /activities:
    get:
      summary: Get the latest activities using the Envelope and Vegas Patterns
      security:
        - bearerAuth: []
      parameters:
        - name: X-Sync-Token
          in: header
          required: false
          schema:
            type: string
          description: Client's version clock to detect staleness
      responses:
        '200':
          description: Successful data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                      syncToken:
                        type: string
        '304':
          description: Not Modified. The client's sync token matches the server version.
  /activities/search:
    get:
      summary: Search for activities based on user, date range, and attribution filter
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: ISO 8601 start date timestamp
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: ISO 8601 end date timestamp
        - name: users
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of User UUIDs to query. Defaults to the requesting user.
        - name: authoredOnly
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: If true, only returns activities directly initiated by the specified users. If false, includes activities on tasks assigned to them.
      responses:
        '200':
          description: Successful data envelope with historical activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
        '400':
          description: Bad request (missing or invalid date parameter)
  /ws:
    get:
      summary: WebSocket Connection for real-time broadcasts
      description: This endpoint upgrades the connection to WebSocket.
      responses:
        '101':
          description: Switching Protocols
  /health:
    get:
      summary: General API health check
      responses:
        '200':
          description: API is healthy
  /health/db:
    get:
      summary: Infrastructure health check (PostgreSQL and Redis)
      responses:
        '200':
          description: Databases connected
  /metadata/providers:
    get:
      summary: Get available provider metadata (e.g., Phorge projects/tags)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope containing ProviderMetadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        provider:
                          type: string
                        type:
                          type: string
                        color:
                          type: string
                          nullable: true
                        icon:
                          type: string
                          nullable: true
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:provider_metadata']
                      timestamp:
                        type: string
                        format: date-time
  /metadata/configs:
    get:
      summary: Get essential provider configurations (e.g., base URLs for deep-linking)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope containing ProviderConfig
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        baseUrl:
                          type: string
                        iconUrl:
                          type: string
                          nullable: true
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:provider_config']
                      timestamp:
                        type: string
                        format: date-time
  /users:
    get:
      summary: Get all registered users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope with user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
  /users/{id}:
    get:
      summary: Get a specific user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful data envelope with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
        '404':
          description: User not found
  /users/sync:
    post:
      summary: Synchronize users from Phorge
      description: This endpoint triggers a manual sync of users from Phorge. It only creates missing users based on their Phorge PHID/Email.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      createdCount:
                        type: integer
                  meta:
                    type: object


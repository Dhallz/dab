openapi: 3.0.3
info:
  title: Dev Activity Board (DAB) API
  description: High-performance aggregator of developer activities, featuring real-time caching and the Vegas Sync Pattern.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK with JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /activities:
    get:
      summary: Get the latest activities using the Envelope and Vegas Patterns
      security:
        - bearerAuth: []
      parameters:
        - name: X-Sync-Token
          in: header
          required: false
          schema:
            type: string
          description: Client's version clock to detect staleness
      responses:
        '200':
          description: Successful data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                      syncToken:
                        type: string
        '304':
          description: Not Modified. The client's sync token matches the server version.
  /activities/past:
    get:
      summary: Fetch historical activities for a specific date directly from Phorge
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: The YYYY-MM-DD date to fetch historical transactions for
      responses:
        '200':
          description: Successful data envelope with historical activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
        '400':
          description: Bad request (missing or invalid date parameter)
  /ws:
    get:
      summary: WebSocket Connection for real-time broadcasts
      description: This endpoint upgrades the connection to WebSocket.
      responses:
        '101':
          description: Switching Protocols
  /health:
    get:
      summary: General API health check
      responses:
        '200':
          description: API is healthy
  /health/db:
    get:
      summary: Infrastructure health check (PostgreSQL and Redis)
      responses:
        '200':
          description: Databases connected
  /metadata/providers:
    get:
      summary: Get available provider metadata (e.g., Phorge projects/tags)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope containing ProviderMetadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        provider:
                          type: string
                        type:
                          type: string
                        color:
                          type: string
                          nullable: true
                        icon:
                          type: string
                          nullable: true
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:provider_metadata']
                      timestamp:
                        type: string
                        format: date-time

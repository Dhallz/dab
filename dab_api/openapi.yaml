openapi: 3.0.3
info:
  title: Dev Activity Board (DAB) API
  description: A lightweight API built with Dart Relic
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Local development server

paths:
  /hello/{name}/age/{age}:
    get:
      summary: Hello World Endpoint
      description: Returns a greeting message personalized with the provided name and age.
      operationId: helloUser
      parameters:
        - name: name
          in: path
          required: true
          description: The name of the user to greet
          schema:
            type: string
        - name: age
          in: path
          required: true
          description: The age of the user
          schema:
            type: integer
      responses:
        '200':
          description: A successful welcome message
          content:
            text/plain:
              schema:
                type: string
                example: "Hello, Nova! To think you are 27 years old.\n"
        '404':
          description: The route was not found or fallback was triggered
          content:
            text/plain:
              schema:
                type: string
                example: "Sorry, that doesn't compute.\n"

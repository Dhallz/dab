          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unresolvedCount:
                        type: integer
  /admin/identities:
    get:
      summary: List all linked identity records.
      description: |
        Administrative endpoint to retrieve all linked user identities across all providers.
        Requires administrator privileges.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `user_identities` | `id` | Primary Key |
        | `userId` | `user_identities` | `user_id` | Foreign Key |
        | `providerId` | `user_identities` | `provider_id` | Provider name |
        | `externalId` | `user_identities` | `external_id` | Provider PHID/ID |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /admin/identities/link:
    post:
      summary: Manually link a user identity.
      description: |
        Administrative endpoint to manually link a DAB user to an external provider's unique ID.
        
        **Request Body**:
        - `userId`: UUID of the DAB user.
        - `providerId`: ID of the provider (e.g., 'phorge', 'github').
        - `externalId`: The unique identifier in the provider's system (e.g., PHID-USER-xxx).
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `userId` | `user_identities` | `user_id` | Link target |
        | `providerId` | `user_identities` | `provider_id` | Source system |
        | `externalId` | `user_identities` | `external_id` | Remote ID |
        | `externalUsername` | `user_identities` | `external_username` | Optional display linkage |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, providerId, externalId]
              properties:
                userId:
                  type: string
                providerId:
                  type: string
                externalId:
                  type: string
                externalUsername:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Identity linked
  /admin/identities/{id}:
    delete:
      summary: Delete a user identity link.
      description: |
        Permanently removes a provider identity row from `user_identities` by primary key.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Identity deleted
        '404':
          description: Identity not found
  /admin/identities/resolve:
    post:
      summary: Resolve identity status.
      description: Administrative endpoint to update identity resolution status (`pending`, `linked`, `failed`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, providerId, status]
              properties:
                userId:
                  type: string
                providerId:
                  type: string
                status:
                  type: string
                  enum: [pending, linked, failed]
      responses:
        '200':
          description: Identity resolved

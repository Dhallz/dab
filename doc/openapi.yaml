openapi: 3.0.3
info:
  title: Dev Activity Board (DAB) API
  description: High-performance aggregator of developer activities, featuring real-time caching and the Vegas Sync Pattern.
  version: 1.0.0
servers:
  - url: http://localhost:9080
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        phorgePhid:
          type: string
          nullable: true
        phorgeUsername:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    ProviderConnectivitySection:
      type: object
      properties:
        status:
          type: string
          enum: [success, warning, failure]
        message:
          type: string

paths:
  /auth/register:
    post:
      summary: Register the bootstrap (first) user in the DAB system.
      description: |
        Registers the bootstrap user account. Self-registration is only open
        while zero users exist; the first user becomes the system admin. All
        subsequent accounts must be created by an administrator via
        `POST /admin/users`. Returns a JWT pair (accessToken and refreshToken).
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `name` | `users` | `name` | Profile name |
        | `email` | `users` | `email` | Unique identifier |
        | `password` | `users` | `password_hash` | Irreversible hash |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Created session (access + refresh token payload)
        '400':
          description: Self-registration is disabled (a user already exists) or validation error
        '403':
          description: Bootstrap lock (email does not match the configured initial admin)
  /auth/refresh:
    post:
      summary: rotate the user's authentication tokens.
      description: |
        Rotates the user's authentication tokens. Validates the refreshToken and returns a new session.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `refreshToken` | `sessions` | `refresh_token` | Token verification |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Success
  /auth/login:
    post:
      summary: Authenticate a user and return JWT tokens.
      description: |
        Authenticates a user with email and password. Returns a JWT pair.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `email` | `users` | `email` | Lookup identifier |
        | `password` | `users` | `password_hash` | Hash comparison |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK with session payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  userId:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  avatarUrl:
                    type: string
                    nullable: true
                  role:
                    type: string
  /activities:
    get:
      summary: Get latest activities (Envelope + Vegas Pattern)
      description: |
        Retrieves the latest activities across all registered providers.
        Uses the **Envelope Pattern** for response consistency and support the **Vegas Sync Pattern** via the `X-Sync-Token` header.
        
        If the provided `X-Sync-Token` matches the server's current version, a `304 Not Modified` response is returned.

        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `activities` | `id` | Primary Key |
        | `userId` | `activities` | `user_id` | Foreign Key to `users.id` |
        | `provider` | `activities` | `provider` | Source identifier |
        | `title` | `activities` | `title` | Activity summary |
        | `content` | `activities` | `content` | Detailed description |
        | `url` | `activities` | `url` | Source link |
        | `createdAt` | `activities` | `created_at` | Audit timestamp |
      security:
        - bearerAuth: []
      parameters:
        - name: X-Sync-Token
          in: header
          required: false
          schema:
            type: string
          description: Client's version clock to detect staleness
      responses:
        '200':
          description: Successful data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                      syncToken:
                        type: string
        '304':
          description: Not Modified. The client's sync token matches the server version.
  /activities/search:
    get:
      summary: Search for activities within a date range.
      description: |
        Searches for activities within a specified date range, scoped to the current sprint project.
        
        **Parameters**:
        - `startDate`: ISO 8601 start date (e.g., `2026-04-06`).
        - `endDate`: ISO 8601 end date.
        - `authoredOnly`: 
          - `true`: Returns only transactions **authored by** the target users.
          - `false`: Returns transactions **authored by** OR **addressed to** (@mentions) the target users.
        - `users`: (Optional) Comma-separated list of User UUIDs. Defaults to current caller.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `activities` | `id` | Primary Key |
        | `userId` | `activities` | `user_id` | Foreign Key to `users.id` |
        | `title` | `activities` | `title` | Search keyword matches here |
        | `createdAt` | `activities` | `created_at` | Activity occurrence timestamp |
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: ISO 8601 start date (YYYY-MM-DD)
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
          description: ISO 8601 end date (YYYY-MM-DD)
        - name: users
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated list of User UUIDs to query. Defaults to the requesting user.
        - name: authoredOnly
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: If true, only returns activities directly authored by the specified users. If false, includes mentions and tags addressed to them.
      responses:
        '200':
          description: Successful data envelope with historical activities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
        '400':
          description: Bad request (missing or invalid date parameter)
  /activities/live:
    get:
      summary: Get live dashboard activities from Redis.
      description: |
        Retrieves Redis-backed live activities for Dashboard realtime hydration.
        This endpoint is dedicated to live data and does not query Postgres directly.

        **Query Parameters**:
        - `limit` (optional, 1..100): Max number of events to read. Default: 50.
        - `scope` (optional): `user` (default) or `global`.

        ### Live Data Mapping
        | API Field | Redis Key | Role |
        | :--- | :--- | :--- |
        | `data[]` | `activities:user:{id}` | User-scoped rolling feed |
        | `data[]` | `activities:global` | Global rolling feed |
        | `meta.syncToken` | `dab:version` | Vegas version clock |
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [user, global]
            default: user
      responses:
        '200':
          description: Successful Redis live-data envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:activity_live']
                      source:
                        type: string
                        enum: ['redis']
                      scope:
                        type: string
                        enum: [user, global]
                      limit:
                        type: integer
                      syncToken:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid query parameter
  /integrations/slack/events:
    post:
      summary: Slack Events API webhook receiver.
      description: |
        Receives Slack Events API callbacks for true push-live ingestion.
        Supports URL verification challenge and signed event callbacks.
      parameters:
        - name: X-Slack-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-Slack-Request-Timestamp
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful acknowledgement or challenge response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  challenge:
                    type: string
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['slack_event_ack']
                      timestamp:
                        type: string
                        format: date-time
        '401':
          description: Invalid Slack signature
  /integrations/github/webhook:
    post:
      summary: GitHub repository webhook receiver (push commits).
      description: |
        Receives signed GitHub webhooks (`X-Hub-Signature-256`).
        Processes `push` events asynchronously into the live-feed pipeline (`ping` acknowledges only).
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              ref: refs/heads/main
              repository:
                full_name: acme/repo
              commits:
                - id: abcdef1
                  distinct: true
                  message: "Example"
                  timestamp: "2026-03-01T12:00:00Z"
                  url: https://github.com/acme/repo/commit/abcdef1
                  author:
                    username: coder
                    name: Coder
      responses:
        '200':
          description: Accepted (processing may be asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['github_webhook_ack']
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid JSON payload
        '401':
          description: Invalid webhook signature or missing headers
        '500':
          description: Webhook secret not configured for active github provider
  /integrations/phorge/webhook:
    post:
      summary: Phorge Herald webhook receiver.
      description: |
        Receives Herald webhook deliveries signed with HMAC-SHA256
        (`X-Phabricator-Webhook-Signature`). Payloads are thin (object PHID +
        transaction PHIDs); the server hydrates the object via Conduit and
        ingests it asynchronously into the live-feed pipeline.
      parameters:
        - name: X-Phabricator-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              object:
                type: TASK
                phid: PHID-TASK-example123
              transactions:
                - phid: PHID-XACT-TASK-example456
      responses:
        '200':
          description: Accepted (processing is asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['phorge_webhook_ack']
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid JSON payload
        '401':
          description: Invalid webhook signature
        '500':
          description: Webhook HMAC key not configured for active phorge provider
  /integrations/jira/webhook:
    post:
      summary: Jira Cloud webhook receiver (issue created/updated).
      description: |
        Receives Jira admin-registered webhooks. When a **Secret** is configured
        on the Jira webhook, payloads are signed with HMAC-SHA256 in the
        `X-Hub-Signature` header (`sha256=<hex>`, WebSub format). DAB verifies
        that signature against `webhookSecret`. Plain `X-Webhook-Secret` or
        `secret` query parameter are accepted as a Bruno simulation fallback only.
        Supported events are `jira:issue_created` and `jira:issue_updated`;
        processing is asynchronous.
      parameters:
        - name: X-Hub-Signature
          in: header
          required: false
          schema:
            type: string
          description: HMAC-SHA256 signature from Jira (`sha256=<hex>`)
        - name: X-Webhook-Secret
          in: header
          required: false
          schema:
            type: string
          description: Bruno simulation fallback only
        - name: secret
          in: query
          required: false
          schema:
            type: string
          description: Bruno simulation fallback only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              webhookEvent: jira:issue_updated
              issue:
                key: DAB-42
                fields:
                  summary: Example issue
                  status:
                    name: In Progress
                  updated: "2026-03-01T15:30:00.000+0000"
      responses:
        '200':
          description: Accepted (processing is asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['jira_webhook_ack']
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid JSON payload
        '401':
          description: Invalid webhook secret
        '500':
          description: Webhook secret not configured for active jira provider
  /integrations/linear/webhook:
    post:
      summary: Linear webhook receiver (Issue create/update).
      description: |
        Receives Linear webhooks signed with HMAC-SHA256 of the raw body
        (`linear-signature` header, hex digest). `linear-delivery` is used for
        deduplication when present. Processing is asynchronous.
      parameters:
        - name: linear-signature
          in: header
          required: true
          schema:
            type: string
        - name: linear-delivery
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              action: update
              type: Issue
              data:
                id: issue-uuid-example
                identifier: DAB-42
                title: Example issue
                url: https://linear.app/acme/issue/DAB-42
                updatedAt: "2026-03-01T15:30:00.000Z"
                state:
                  name: In Progress
                team:
                  key: DAB
      responses:
        '200':
          description: Accepted (processing is asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['linear_webhook_ack']
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid JSON payload
        '401':
          description: Invalid webhook signature
        '500':
          description: Webhook secret not configured for active linear provider
  /integrations/gitlab/webhook:
    post:
      summary: GitLab webhook receiver (Push Hook).
      description: |
        Receives GitLab project webhooks authenticated with a plain shared
        token in the `X-Gitlab-Token` header (constant-time compare, no HMAC).
        Processes `push` events asynchronously into the live-feed pipeline.
      parameters:
        - name: X-Gitlab-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Gitlab-Event
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              object_kind: push
              ref: refs/heads/main
              checkout_sha: abcdef1234567890abcdef1234567890abcdef12
              project:
                path_with_namespace: acme/app
              commits:
                - id: abcdef1234567890abcdef1234567890abcdef12
                  message: Example commit
                  timestamp: "2026-03-01T15:30:00Z"
                  url: https://gitlab.com/acme/app/-/commit/abcdef1
                  author:
                    name: Dev User
                    email: dev@example.com
      responses:
        '200':
          description: Accepted (processing is asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['gitlab_webhook_ack']
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid JSON payload
        '401':
          description: Invalid webhook token
        '500':
          description: Webhook secret not configured for active gitlab provider
  /integrations/bitbucket/webhook:
    post:
      summary: Bitbucket Cloud webhook receiver (repo:push).
      description: |
        Receives Bitbucket Cloud repository webhooks signed with HMAC-SHA256
        (`X-Hub-Signature` header, `sha256=<hex>`). `X-Request-UUID` /
        `X-Hook-UUID` are used for deduplication when present. Processes
        `repo:push` events asynchronously into the live-feed pipeline.
      parameters:
        - name: X-Hub-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-Event-Key
          in: header
          required: false
          schema:
            type: string
        - name: X-Request-UUID
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              repository:
                full_name: acme/app
              push:
                changes:
                  - new:
                      type: branch
                      name: main
                    commits:
                      - hash: abcdef1234567890abcdef1234567890abcdef12
                        message: Example commit
                        date: "2026-03-01T15:30:00+00:00"
                        author:
                          raw: "Dev User <dev@example.com>"
      responses:
        '200':
          description: Accepted (processing is asynchronous)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted:
                        type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['bitbucket_webhook_ack']
                      timestamp:
                        type: string
                        format: date-time
        '400':
          description: Invalid JSON payload
        '401':
          description: Invalid webhook signature
        '500':
          description: Webhook secret not configured for active bitbucket provider
  /ws:
    get:
      summary: WebSocket Connection for real-time broadcasts
      description: This endpoint upgrades the connection to WebSocket.
      security:
        - bearerAuth: []
      responses:
        '101':
          description: Switching Protocols
  /health:
    get:
      summary: API availability health check.
      description: |
        Simple check to verify the API server is up and running.
        
        ### Database Mapping
        | Action | Status | Role |
        | :--- | :--- | :--- |
        | N/A | N/A | No DB interaction |
      responses:
        '200':
          description: API is healthy
  /health/db:
    get:
      summary: Infrastructure (DB) health check.
      description: |
        Verifies connectivity to the PostgreSQL database.
        
        ### Database Mapping
        | Target | Action | Role |
        | :--- | :--- | :--- |
        | PostgreSQL | Ping (`SELECT 1`) | Connectivity Test |
      responses:
        '200':
          description: Databases connected
  /metadata/providers:
    get:
      summary: Get available provider metadata (e.g., Phorge projects/tags)
      description: |
        Retrieves metadata for configured providers (e.g., Phorge projects, repository tags).
        This is used to populate filters and categories in the UI.
        
        ### Database Mapping
        | Action | Source | Logic |
        | :--- | :--- | :--- |
        | READ | `provider_configs` | Fetches active providers |
        | CACHE | Redis | Merged with provider-specific cached metadata |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope containing ProviderMetadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        provider:
                          type: string
                        type:
                          type: string
                        color:
                          type: string
                          nullable: true
                        icon:
                          type: string
                          nullable: true
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:provider_metadata']
                      timestamp:
                        type: string
                        format: date-time
  /metadata/capabilities:
    get:
      summary: Get provider live ingestion capabilities.
      description: |
        Returns provider live-ingestion capabilities used by Dashboard strategy.
        This allows clients to prefer webhook/websocket when available and use
        API polling fallback otherwise.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope containing provider capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        providerId:
                          type: string
                        ingestionMode:
                          type: string
                          enum: [webhook, polling, hybrid]
                        supportsWebhook:
                          type: boolean
                        supportsWebSocket:
                          type: boolean
                        supportsPolling:
                          type: boolean
                        isActive:
                          type: boolean
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:provider_capability']
                      timestamp:
                        type: string
                        format: date-time
  /metadata/configs:
    get:
      summary: Get public provider configurations.
      description: Returns base URLs and icon URLs for active providers, used for deep-linking in the UI.
      responses:
        '200':
          description: Successful data envelope containing ProviderConfig
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        baseUrl:
                          type: string
                        iconUrl:
                          type: string
                          nullable: true
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['list:provider_config']
                      isSystemConfigured:
                        type: boolean
                      timestamp:
                        type: string
                        format: date-time
  /metadata/status:
    get:
      summary: Get bootstrap/system readiness state.
      description: Returns whether the platform is configured (admin + active provider config) and the organization timezone used for calendar-day boundaries.
      responses:
        '200':
          description: Successful system status envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isSystemConfigured:
                        type: boolean
                      systemTimezone:
                        type: string
                        example: UTC
                        description: IANA organization timezone for calendar-day boundaries.
                  meta:
                    type: object
                    properties:
                      dataType:
                        type: string
                        enum: ['system_status']
                      timestamp:
                        type: string
                        format: date-time
  /users:
    get:
      summary: List all registered users.
      description: |
        Returns a list of all registered users in the system.
        The first user's ID is automatically captured into the `targetUserId` variable for use in other requests.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `users` | `id` | Primary Key |
        | `name` | `users` | `name` | Display name |
        | `email` | `users` | `email` | Unique identifier |
        | `role` | `users` | `role` | Permissions group |
        | `avatarUrl` | `users` | `avatar_url` | Profile image |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful data envelope with user list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
  /users/{id}:
    get:
      summary: Get a specific user by ID
      description: |
        Retrieves the profile details for a specific user.
        Requires a valid `targetUserId` variable.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `users` | `id` | Lookup identifier |
        | `name` | `users` | `name` | Value from user record |
        | `role` | `users` | `role` | User role |
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful data envelope with user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
        '404':
          description: User not found
  /users/sync:
    post:
      summary: Synchronize users from Phorge
      description: |
        Triggers a manual synchronization of users from the configured Phorge instance.
        This will create new users in the DAB system if they exist in Phorge but not in DAB.
        
        ### Database Mapping
        | Action | DB Table | Logic |
        | :--- | :--- | :--- |
        | INSERT | `users` | Created if email/phid not found |
        | UPDATE | `users` | Metadata updated if existing |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sync completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      createdCount:
                        type: integer
                  meta:
                    type: object
  /admin/users:
    get:
      summary: Administrative endpoint to retrieve all users.
      description: |
        Administrative endpoint to retrieve all users with full metadata.
        Requires administrator privileges.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `users` | `id` | Primary Key |
        | `name` | `users` | `name` | Full name |
        | `email` | `users` | `email` | Unique identifier |
        | `role` | `users` | `role` | Access level |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: Create a new user account (admin only).
      description: |
        Administrative endpoint to create a new user account. This is the only
        account creation path after the bootstrap admin has registered.
        
        When domain validation is enabled (`allowed_domain_enabled` system
        setting), the email must match the configured `allowed_domain`;
        otherwise any email is accepted. Existing accounts outside the domain
        are unaffected by the toggle.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `name` | `users` | `name` | Full name |
        | `email` | `users` | `email` | Unique login identifier |
        | `password` | `users` | `password_hash` | Stored as bcrypt hash |
        | `role` | `users` | `role` | Access control role |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                role:
                  type: string
                  enum: [admin, manager, standard]
                  default: standard
      responses:
        '200':
          description: Created user (without password hash)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error (missing fields, duplicate email, or domain restriction)
  /admin/users/role:
    post:
      summary: Update a user's role.
      description: |
        Administrative endpoint to modify a user's role (e.g., 'user', 'admin').
        
        **Request Body**:
        - `userId`: UUID of the target user.
        - `role`: The new role to assign.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `userId` | `users` | `id` | Target record |
        | `role` | `users` | `role` | Value to update |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Role updated
  /admin/configs:
    get:
      summary: Get internal provider configurations.
      description: |
        Administrative endpoint to retrieve all internal provider configurations including sensitive settings.
        
        Returns a list of `ProviderConfig` objects. It also automatically scripts the extraction of a `targetProviderId` and `targetProviderUrl` into the environment for use in subsequent requests (Save/Test/Link).
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `provider_configs` | `id` | Provider slug |
        | `name` | `provider_configs` | `name` | Display label |
        | `baseUrl` | `provider_configs` | `base_url` | API endpoint |
        | `isActive` | `provider_configs` | `is_active` | Sync status |
        | `settings` | `provider_configs` | `settings` | JSONB config |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
    post:
      summary: Save or update a provider configuration.
      description: |
        Administrative endpoint to create or update a provider configuration.
        
        **Request Body**:
        - `id`: Unique identifier for the provider (e.g., 'github', 'jira').
        - `name`: Display name.
        - `baseUrl`: Root URL of the provider API.
        - `isActive`: Boolean toggle for syncing.
        - `settings`: Map of provider-specific sensitive settings (e.g., `apiToken`).
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `id` | `provider_configs` | `id` | Target record |
        | `name` | `provider_configs` | `name` | Update value |
        | `baseUrl` | `provider_configs` | `base_url` | Update value |
        | `isActive` | `provider_configs` | `is_active` | Update value |
        | `settings` | `provider_configs` | `settings` | Merged JSONB |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, baseUrl, isActive]
              properties:
                id:
                  type: string
                name:
                  type: string
                baseUrl:
                  type: string
                isActive:
                  type: boolean
                settings:
                  type: object
      responses:
        '200':
          description: Config saved
  /admin/configs/test:
    post:
      summary: Test provider connectivity.
      description: |
        Verifies connection to a provider without saving the config. Requires admin privileges.
        Returns a structured report with **Core**, **Live**, and **Polling** section results.

        - **Core**: API credentials and base configuration (auth probe).
        - **Live**: Strict external signal — last successful webhook/event ingest recorded in Redis within **7 days** (`live:last_ingest:{providerId}`). If none exists, Admin **Try** runs an internal webhook test delivery (validates signing secrets) and records the same key. Discord uses Gateway connection plus recent ingest or gateway test on Try.
        - **Polling**: Read-only polling probe (commits, channel history, JQL, etc.).

        **Aggregate** (main Admin card light) is derived from Live + Polling only:
        both success → `success`; exactly one success → `warning`; neither → `failure`.
        Core has its own section light but does not change the aggregate color.

        Slack configs are validated with `auth.test` and support `settings.botToken`
        (plus optional `settings.apiBaseUrl`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Connectivity test result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      aggregate:
                        type: string
                        enum: [success, warning, failure]
                        example: success
                      summaryMessage:
                        type: string
                        example: Live and polling verified
                      sections:
                        type: object
                        properties:
                          core:
                            $ref: '#/components/schemas/ProviderConnectivitySection'
                          live:
                            $ref: '#/components/schemas/ProviderConnectivitySection'
                          polling:
                            $ref: '#/components/schemas/ProviderConnectivitySection'
  /admin/system-settings:
    get:
      summary: Retrieve system configuration settings.
      description: |
        Administrative endpoint to retrieve system configuration settings such as `allowed_domain_enabled`, `allowed_domain`, `public_api_url`, and `system_timezone`.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `allowed_domain_enabled` | `system_settings` | `value` where `key = 'allowed_domain_enabled'` | Whether domain validation is enforced on account creation ('true'/'false') |
        | `allowed_domain` | `system_settings` | `value` where `key = 'allowed_domain'` | Allowed email domain (kept even while validation is disabled) |
        | `public_api_url` | `system_settings` | `value` where `key = 'public_api_url'` | Public DAB API base URL used to compose provider webhook endpoints in Admin |
        | `system_timezone` | `system_settings` | `value` where `key = 'system_timezone'` | IANA organization timezone for calendar-day boundaries (default `UTC`) |
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      allowed_domain_enabled:
                        type: string
                        enum: ['true', 'false']
                      allowed_domain:
                        type: string
                      public_api_url:
                        type: string
                      system_timezone:
                        type: string
                        example: America/New_York
    put:
      summary: Update system configuration settings.
      description: |
        Administrative endpoint to update system configuration settings
        (key-value pairs, stored as-is).
        
        Existing accounts outside the allowed domain are grandfathered:
        enabling validation only gates future account creations, never login.
        
        ### Database Mapping
        | API Field | DB Table | DB Column | Role |
        | :--- | :--- | :--- | :--- |
        | `allowed_domain_enabled` | `system_settings` | `value` where `key = 'allowed_domain_enabled'` | Whether domain validation is enforced on account creation ('true'/'false') |
        | `allowed_domain` | `system_settings` | `value` where `key = 'allowed_domain'` | Allowed email domain (kept even while validation is disabled) |
        | `public_api_url` | `system_settings` | `value` where `key = 'public_api_url'` | Public DAB API base URL used to compose provider webhook endpoints in Admin |
        | `system_timezone` | `system_settings` | `value` where `key = 'system_timezone'` | IANA organization timezone for calendar-day boundaries (default `UTC`) |
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed_domain_enabled:
                  type: string
                  enum: ['true', 'false']
                allowed_domain:
                  type: string
                  nullable: true
                public_api_url:
                  type: string
                  nullable: true
                system_timezone:
                  type: string
                  nullable: true
                  example: America/New_York
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /admin/identities/summary:
    get:
      summary: Unresolved identity count for admin UI badge.
      description: |
        Returns `data.unresolvedCount` — identities in `pending` or `failed` state.
        Requires administrator privileges.
